<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TüFolk Repertoire</title>
    
    <!-- PWA Icons & Theme Color -->
    <link rel="icon" type="image/png" href="/TüFolk Logo.png" />
    <link rel="apple-touch-icon" href="/TüFolk Logo.png" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="TüFolk Sheet Music Repertoire App">
    
    <!-- Catch install prompt early -->
    <script>
        window.pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.pwaInstallPrompt = e;
        });
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
